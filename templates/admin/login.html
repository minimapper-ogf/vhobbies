{% extends 'base.html' %}{% block content %}<h1>Admin login</h1>
{% if not configured %}<div class="flash error">Login is disabled until you set a real <b>ADMIN_PASSWORD</b> and <b>SECRET_KEY</b> in config.py.</div>{% endif %}
<form class="panel" method="post" style="max-width:460px"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username</label><input type="text" name="username" autofocus autocomplete="username">
<label>Password</label><input type="password" name="password" autocomplete="current-password">
<p><button>Log in</button></p></form>{% endblock %}
